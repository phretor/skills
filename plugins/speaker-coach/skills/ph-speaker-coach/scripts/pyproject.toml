[project]
name = "speaker-coach-scripts"
version = "1.0.0"
description = "Slide-deck ingestion utilities for the speaker-coach skill."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "RUF"]
ignore = []
